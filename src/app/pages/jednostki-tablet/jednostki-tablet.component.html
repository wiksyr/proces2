

<dx-toolbar class="toolbar-details theme-dependent">
    <!-- <dxi-item location="before">
      <dx-button icon="search" stylingMode="text"></dx-button>
    </dxi-item> -->
    <dxi-item location="before">

        <dx-text-box [placeholder]="'Szukaj...'" [width]="'150'" [(value)]="search">
            <dxi-button
            name="icon"
            location="before"
            [options]="{ icon: 'search', elementAttr: { class: 'form-editor-icon' }, stylingMode: 'text' }"
        ></dxi-button>
        </dx-text-box>
    </dxi-item>
    <dxi-item location="before">
        <dx-button [text]="''" icon="search" (onClick)="filter()"></dx-button>
    </dxi-item>
    <dxi-item location="before">
        <dx-button [text]="''" icon="arrowleft" (onClick)="movePrevious()"></dx-button>
    </dxi-item>
    <dxi-item location="before">
        <dx-button [text]="''" icon="arrowright" (onClick)="moveNext()"></dx-button>
    </dxi-item>
    <dxi-item location="before">
        <dx-button [text]="''" icon="clear" (onClick)="clear()"></dx-button>
    </dxi-item>
</dx-toolbar>
<card-jednostka-skrocona [jednostki]="data" [isLoading]="isLoading"></card-jednostka-skrocona>
