<dx-toolbar>
    <dxi-item location="before"
      ><span [class]="titleClass">Details</span>
    </dxi-item>
    <dxi-item location="after" locateInMenu="after" [visible]="!isEditing">
      <dx-button
        text="Edytuj"
        icon="edit"
        stylingMode="contained"
        type="default"
        (onClick)="handleEditClick()"
      ></dx-button>
    </dxi-item>
    <dxi-item location="after" locateInMenu="after" [visible]="isEditing">
      <dx-button
        text="Zapisz"
        stylingMode="contained"
        type="default"
        (onClick)="handleSaveButtonClick($event)"
      ></dx-button>
    </dxi-item>
    <dxi-item location="after" locateInMenu="after" [visible]="isEditing">
      <dx-button
        text="Anuluj"
        (onClick)="handleCancelEditClick()"
        stylingMode="outlined"
        type="normal"
      ></dx-button>
    </dxi-item>
  </dx-toolbar>
